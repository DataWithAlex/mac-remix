[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djprep"
version = "0.1.0"
description = "Python-based DJ/remix library management and stems workflow utilities."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Alex Sciuto"}
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "demucs>=4.0.0",
  "mutagen>=1.47.0",
  "pydub>=0.25.1",
  "ffmpeg-normalize>=1.27.6",
  "librosa>=0.10.1",
  "soundfile>=0.12.1",
  "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "black>=24.3.0"
]

[project.scripts]
djprep = "djprep.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
